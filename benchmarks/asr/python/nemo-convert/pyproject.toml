[project]
name = "vesper-nemo-convert"
version = "0.0.0"
description = "Isolated NeMo-Speech.cpp GGUF conversion tooling for published speech checkpoints; not part of the desktop runtime"
requires-python = ">=3.12,<3.13"
# Converter dependencies of NeMo-Speech.cpp 4f9676226f667d14608487df744f375db87127f8 (the pinned runtime).
# Its requirements.txt pins torch~=2.6.0, which has known advisories; torch 2.14.1 is used instead and the
# ASR conversion is checked against NVIDIA's published GGUF. torchaudio is not imported by the converter.
dependencies = [
    "gguf==0.19.0",
    "huggingface-hub==1.5.0",
    "librosa==0.11.0",
    "numpy==1.26.4",
    "pyyaml==6.0.3",
    "sentencepiece==0.2.1",
    "silero-vad==6.2.0",
    "torch==2.14.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
