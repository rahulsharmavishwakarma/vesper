[project]
name = "vesper-term-eval-corpus"
version = "0.0.0"
description = "Deterministic frozen term-recognition evaluation corpus generator; not part of the desktop runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.4",
    "soundfile==0.14.0",
]

[tool.uv]
package = false
required-version = ">=0.13.5,<0.14"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
