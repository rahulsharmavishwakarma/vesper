[project]
name = "vesper-audio-frontend-probe"
version = "0.0.0"
description = "Isolated development probe; not part of the desktop runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "soundfile==0.14.0",
    "onnxruntime==1.31.0",
    "ai-edge-litert==2.3.0",
]

[tool.uv]
package = false
required-version = ">=0.12.15,<0.13"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
