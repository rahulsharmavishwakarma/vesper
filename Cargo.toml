# Vesper Rust workspace; member paths are relative to this manifest.
[workspace]
exclude = ["vendor/glib", "tests/glib-backport"]
members = [
    "apps/desktop/src-tauri",
    "crates/vesper-core",
    "crates/vesper-audio",
    "crates/vesper-inference",
    "crates/vesper-data",
    "crates/vesper-models",
    "crates/vesper-nemo",
    "crates/vesper-mlx",
    "crates/vesper-eval",
    "crates/vesper-desktop-platform",
]
default-members = ["crates/vesper-core", "crates/vesper-audio", "crates/vesper-inference", "crates/vesper-data", "crates/vesper-models"]
resolver = "2"

[workspace.package]
version = "0.1.1-rc.4"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
vesper-core = { path = "crates/vesper-core" }
vesper-audio = { path = "crates/vesper-audio" }
vesper-inference = { path = "crates/vesper-inference" }
vesper-data = { path = "crates/vesper-data" }
vesper-models = { path = "crates/vesper-models" }
vesper-nemo = { path = "crates/vesper-nemo" }
vesper-mlx = { path = "crates/vesper-mlx" }
vesper-eval = { path = "crates/vesper-eval" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Keep integrity checks responsive in development when hashing >1 GB of weights.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.vesper-models]
opt-level = 2

# GTK3 requires GLib 0.18. This source contains the upstream VariantStrIter fix.
# scripts/audit-rust.py verifies its full provenance before the strict audit.
[patch.crates-io]
glib = { path = "vendor/glib" }
