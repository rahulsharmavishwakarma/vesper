[package]
name = "vesper-desktop"
description = "Vesper: local speech recognition and faithful text cleanup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
mlx = ["vesper-inference/mlx"]
cuda = ["vesper-inference/cuda"]
vulkan = ["vesper-inference/vulkan"]
rocm = ["vesper-inference/rocm"]

[lib]
name = "vesper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
vesper-core.workspace = true
vesper-data.workspace = true
vesper-audio.workspace = true
vesper-inference.workspace = true
vesper-models.workspace = true
vesper-desktop-platform = { path = "../../../crates/vesper-desktop-platform" }

[lints]
workspace = true

[dev-dependencies]
sha2.workspace = true
