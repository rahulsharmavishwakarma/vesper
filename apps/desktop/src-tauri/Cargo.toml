[package]
name = "transcribe-desktop"
description = "transcribe: local speech recognition and faithful text cleanup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["transcribe-inference/cuda"]
vulkan = ["transcribe-inference/vulkan"]
rocm = ["transcribe-inference/rocm"]

[lib]
name = "transcribe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
transcribe-core.workspace = true
transcribe-data.workspace = true
transcribe-audio.workspace = true
transcribe-inference.workspace = true
transcribe-models.workspace = true
transcribe-desktop-platform = { path = "../../../crates/transcribe-desktop-platform" }

[lints]
workspace = true
