<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vesper</title>
    <meta name="description" content="Vesper: voice to text, on your device." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --text: #f4efe9;
        --muted: #a39b92;
        --ember: #ff6b3d;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        box-sizing: border-box;
        max-width: 32rem;
        padding: 2rem 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        color: var(--ember);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vesper</h1>
      <p>Voice to text, on your device.</p>
      <p>
        The project site is on its way. Until then, get the app and release notes from the
        <a href="https://github.com/rahulsharmavishwakarma/vesper/releases">Releases page</a>
        or read the
        <a href="https://github.com/rahulsharmavishwakarma/vesper#readme">README</a>.
      </p>
    </main>
  </body>
</html>
