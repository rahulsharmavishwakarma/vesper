version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: [dependencies]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /
    labels: [dependencies]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # vesper-models enables sha2's `asm` feature for hardware SHA-256 on
      # aarch64; 0.11 removed it, so the grouped update cannot resolve (#338).
      # Move deliberately, after measuring 0.11's hashing speed on Apple silicon.
      - dependency-name: sha2
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, ci]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    labels: [dependencies, ci]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directories:
      - /
      - /benchmarks/asr/python/audio-frontend
    labels: [dependencies, testing]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      test-tooling:
        patterns: ["*"]
