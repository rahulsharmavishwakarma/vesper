name: Bug report
description: Report a reproducible problem in Vesper
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Vesper. Do not attach private recordings, transcripts, model tokens, or credentials.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Vesper with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vesper version
      description: Shown in About. For a source build, give the Git commit.
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      options:
        - Stable
        - Beta or release candidate
        - Nightly
        - Built from source
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 26.1
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Speech and writing model
      description: From the Models tab, if the problem involves transcription or cleanup.
      placeholder: Cohere Transcribe, Qwen3.5 writer
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove transcripts, local paths, tokens, and other sensitive information first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private audio, transcripts, credentials, and tokens.
          required: true
