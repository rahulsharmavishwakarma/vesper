name: Bug report
description: Report a reproducible problem in transcribe
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve transcribe. Do not attach private recordings, transcripts, model tokens, or credentials.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start transcribe with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Browser preview
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release version or Git commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include OS version, architecture, microphone or file format, and selected model profile where relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove transcripts, local paths, tokens, and other sensitive information first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private audio, transcripts, credentials, and tokens.
          required: true
