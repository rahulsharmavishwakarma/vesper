name: Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and repository hygiene
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: '**/uv.lock'
      - run: uv sync --locked
      - run: make python-lock-check
      - name: Check repository hygiene
        env:
          SKIP: transcribe-fast-check
        run: |
          uv run --locked pre-commit run --all-files --show-diff-on-failure
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint, type-check, test and build portable source
        run: make check-portable

  browser:
    name: Browser regressions
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: make test-browser
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  rust:
    name: Rust (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Check macOS native prerequisites
        run: |
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
          xcrun --find clang
          xcrun --find clang++
          if [ "$(uname -m)" = arm64 ]; then
            test -d "$DEVELOPER_DIR"
            xcodebuild -version
            xcrun swift --version
            if ! xcrun metal --version; then
              xcodebuild -downloadComponent metalToolchain
            fi
            xcrun metal --version
          fi
      - name: Cache pinned patched sherpa-onnx build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling/sherpa-runtime
          key: sherpa-patched-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/sherpa-onnx/**', 'scripts/sherpa-runtime.mjs') }}
      - name: Build and verify native completion reporting
        run: |
          node scripts/sherpa-runtime.mjs
          printf 'SHERPA_ONNX_LIB_DIR=%s\n' "$(node scripts/sherpa-runtime.mjs --lib-dir)" >> "$GITHUB_ENV"
          make test-native-report
      - run: npm ci
      - name: Rust formatting
        run: make fmt-rust-check
      - name: Compile all Rust targets
        run: make check-rust
      - name: Rust target tests and doctests
        run: make test-rust
      - name: Strict Clippy and rustdoc
        run: make lint-rust doc-rust
      - name: Build the macOS application bundle without loading models
        run: |
          make build-debug
          product_name=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').productName")
          app="target/debug/bundle/macos/$product_name.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -x "$app/Contents/MacOS/$executable"
          if [ "$(uname -m)" = arm64 ]; then
            test -s "$app/Contents/Resources/mlx-runtime/libTranscribeMLX.dylib"
            test -s "$app/Contents/Resources/mlx-runtime/mlx.metallib"
            test -x "$app/Contents/Resources/mlx-runtime/prepare-qwen-tokenizer"
          fi
