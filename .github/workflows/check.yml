name: Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and repository hygiene
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: '**/uv.lock'
      - run: uv sync --locked
      - run: make python-lock-check
      - name: Check repository hygiene
        env:
          SKIP: vesper-fast-check
        run: |
          uv run --locked pre-commit run --all-files --show-diff-on-failure
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint, type-check, test and build portable source
        run: make check-portable

  browser:
    name: Browser regressions
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: make test-browser
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  rust:
    name: Rust (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      # CI never debugs these artifacts: skip incremental state and full debuginfo.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect documentation-only change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          skip=false
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            # Only docs/** and Markdown skip the heavy build: no Rust code or
            # test reads them (the vendored glib crate includes its own README).
            if ! git diff --name-only "$BASE_SHA" HEAD | grep -v -E '^(docs/.*|.*\.md)$' | grep -q .; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "Documentation-only change: Rust build and tests skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      # The strict bundle build packages the speaker runtime through uv.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.skip != 'true'
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: false
      - name: Install Rust
        if: steps.scope.outputs.skip != 'true'
        run: rustup show active-toolchain
      - name: Cache Cargo registry and dependency builds
        if: steps.scope.outputs.skip != 'true'
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.3
        with:
          shared-key: rust-macos
          # Only main saves, so pull requests restore without churning the
          # shared 10 GB repository cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check macOS native prerequisites
        if: steps.scope.outputs.skip != 'true'
        run: |
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
          xcrun --find clang
          xcrun --find clang++
          if [ "$(uname -m)" = arm64 ]; then
            test -d "$DEVELOPER_DIR"
            xcodebuild -version
            xcrun swift --version
            if ! xcrun metal --version; then
              xcodebuild -downloadComponent metalToolchain
            fi
            xcrun metal --version
          fi
      - name: Cache pinned patched sherpa-onnx build
        if: steps.scope.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling/sherpa-runtime
          key: sherpa-patched-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/sherpa-onnx/**', 'scripts/sherpa-runtime.mjs') }}
      - name: Build and verify native completion reporting
        if: steps.scope.outputs.skip != 'true'
        run: |
          node scripts/sherpa-runtime.mjs
          printf 'SHERPA_ONNX_LIB_DIR=%s\n' "$(node scripts/sherpa-runtime.mjs --lib-dir)" >> "$GITHUB_ENV"
          make test-native-report
      - name: Cache pinned diarization runtime staging
        if: steps.scope.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling/diarization-runtime
          key: diarization-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/diarization-runtime.mjs', 'scripts/build-diarization-runtime.mjs', 'crates/vesper-models/src/diarization.rs') }}
      - name: Stage diarization runtime without model downloads
        if: steps.scope.outputs.skip != 'true'
        run: node scripts/diarization-runtime.mjs
      - run: npm ci
        if: steps.scope.outputs.skip != 'true'
      - name: Rust formatting
        if: steps.scope.outputs.skip != 'true'
        run: make fmt-rust-check
      - name: Compile all Rust targets
        if: steps.scope.outputs.skip != 'true'
        run: make check-rust
      - name: Rust target tests and doctests
        if: steps.scope.outputs.skip != 'true'
        run: make test-rust
      - name: Strict Clippy and rustdoc
        if: steps.scope.outputs.skip != 'true'
        run: make lint-rust doc-rust
      - name: Build the macOS application bundle without loading models
        if: steps.scope.outputs.skip != 'true'
        run: |
          make build-debug
          product_name=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').productName")
          app="target/debug/bundle/macos/$product_name.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -x "$app/Contents/MacOS/$executable"
          # An unsealed bundle downloads as "damaged" on other Macs (#239).
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$(uname -m)" = arm64 ]; then
            test -s "$app/Contents/Resources/mlx-runtime/libVesperMLX.dylib"
            test -s "$app/Contents/Resources/mlx-runtime/mlx.metallib"
            test -x "$app/Contents/Resources/mlx-runtime/prepare-qwen-tokenizer"
          fi
