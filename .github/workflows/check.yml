name: Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Decide which checks this change needs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      browser: ${{ steps.decide.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is the
          # current base, so this diff is exactly the change being merged.
          fetch-depth: 2
      - name: Classify changed paths
        id: decide
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | node scripts/ci-scope.mjs | tee -a "$GITHUB_OUTPUT"
          else
            node scripts/ci-scope.mjs < /dev/null | tee -a "$GITHUB_OUTPUT"
          fi
          {
            echo "Changed-path scope:"
            cat "$GITHUB_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend and repository hygiene
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: '**/uv.lock'
      - run: uv sync --locked
      - run: make python-lock-check
      - name: Check repository hygiene
        env:
          SKIP: vesper-fast-check
        run: |
          uv run --locked pre-commit run --all-files --show-diff-on-failure
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint, type-check, test and build portable source
        run: make check-portable

  browser:
    name: Browser regressions
    needs: scope
    # A skipped job reports success, so a failed scope job must run it, not skip it.
    if: ${{ !cancelled() && needs.scope.outputs.browser != 'false' }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: make test-browser
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  rust:
    name: Rust (macOS)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      # CI never debugs these artifacts: skip incremental state and full debuginfo.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The strict bundle build packages the speaker runtime through uv.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: false
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Cache Cargo registry and dependency builds
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.3
        with:
          shared-key: rust-macos
          # Only main saves, so pull requests restore without churning the
          # shared 10 GB repository cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check macOS native prerequisites
        run: |
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
          xcrun --find clang
          xcrun --find clang++
          if [ "$(uname -m)" = arm64 ]; then
            test -d "$DEVELOPER_DIR"
            xcodebuild -version
            xcrun swift --version
            if ! xcrun metal --version; then
              xcodebuild -downloadComponent metalToolchain
            fi
            xcrun metal --version
          fi
      - name: Cache pinned patched sherpa-onnx build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling/sherpa-runtime
          key: sherpa-patched-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/sherpa-onnx/**', 'scripts/sherpa-runtime.mjs') }}
      - name: Build and verify native completion reporting
        run: |
          node scripts/sherpa-runtime.mjs
          printf 'SHERPA_ONNX_LIB_DIR=%s\n' "$(node scripts/sherpa-runtime.mjs --lib-dir)" >> "$GITHUB_ENV"
          make test-native-report
      - name: Cache pinned diarization runtime staging
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling/diarization-runtime
          key: diarization-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/diarization-runtime.mjs', 'scripts/build-diarization-runtime.mjs', 'crates/vesper-models/src/diarization.rs') }}
      - name: Stage diarization runtime without model downloads
        run: node scripts/diarization-runtime.mjs
      - run: npm ci
      - name: Rust formatting
        run: make fmt-rust-check
      - name: Compile all Rust targets
        run: make check-rust
      - name: Rust target tests and doctests
        run: make test-rust
      - name: Strict Clippy and rustdoc
        run: make lint-rust doc-rust
      # The MLX Swift packages take about 8 minutes to compile from scratch.
      # Dependency, patch or build-script changes start cold (the patched
      # checkouts live in this directory), as do Xcode changes (keep `xcode26.3`
      # in the key in step with DEVELOPER_DIR); bridge-source changes restore the
      # previous build so SwiftPM rebuilds only VesperMLX. Only main saves.
      - name: Restore the MLX Swift build
        id: mlx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling/mlx-build
          key: mlx-build-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('native/mlx/Package.swift', 'native/mlx/Package.resolved', 'patches/mlx-audio-swift/**', 'scripts/mlx-runtime.mjs', 'scripts/mlx-build-directories.mjs') }}-${{ hashFiles('native/mlx/Sources/**') }}
          restore-keys: |
            mlx-build-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('native/mlx/Package.swift', 'native/mlx/Package.resolved', 'patches/mlx-audio-swift/**', 'scripts/mlx-runtime.mjs', 'scripts/mlx-build-directories.mjs') }}-
      - name: Build the macOS application bundle without loading models
        run: |
          make build-debug
          product_name=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').productName")
          app="target/debug/bundle/macos/$product_name.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -x "$app/Contents/MacOS/$executable"
          # An unsealed bundle downloads as "damaged" on other Macs (#239).
          codesign --verify --deep --strict --verbose=2 "$app"
          # The hardened runtime enforces library validation, which rejects the
          # ad hoc MLX library: Parakeet then shows "dlopen failed" (#245).
          if codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "App carries the hardened runtime flag; it cannot load the ad hoc MLX library." >&2
            exit 1
          fi
          if [ "$(uname -m)" = arm64 ]; then
            test -s "$app/Contents/Resources/mlx-runtime/libVesperMLX.dylib"
            test -s "$app/Contents/Resources/mlx-runtime/mlx.metallib"
            test -x "$app/Contents/Resources/mlx-runtime/prepare-qwen-tokenizer"
          fi
      - name: Save the MLX Swift build from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mlx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling/mlx-build
          key: ${{ steps.mlx-cache.outputs.cache-primary-key }}
