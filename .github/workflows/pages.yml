name: Pages

# Publishes the landing page (issue #329) and the machine-readable release
# feeds on GitHub Pages (issue #262). scripts/build-site.mjs assembles the page,
# its font and benchmarks.json from models/recommendations.json; release
# workflows attach their feed to the release and this workflow republishes the
# newest one beside the page. Deployment uses the official Pages actions: no
# branch push and no ruleset bypass.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'models/recommendations.json'
      - 'models/catalog.json'
      - 'apps/desktop/src/assets/bricolage-*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the project site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Assemble the site and its release feeds
        run: |
          set -eu
          # The page, its font and benchmarks.json (Vesper's own passing
          # results); the feeds are added next and are never part of site/.
          node scripts/build-site.mjs --out=_site
          # The newest nightly release carries the signed nightly feed; an
          # unsigned build has none, and then no feed is published.
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[]|select(.tag_name|startswith("nightly-"))][0].tag_name // ""')"
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern nightly.json --dir _site \
              || echo "Release $tag has no nightly.json; no nightly feed published." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The newest published pre-release carries the beta feed that stable
          # builds check when the user opts in to beta and pre-release updates
          # (#277). Nightlies have their own tags and feed.
          beta_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[]|select((.draft|not) and .prerelease and (.tag_name|startswith("v")))][0].tag_name // ""')"
          if [ -n "$beta_tag" ]; then
            gh release download "$beta_tag" --repo "$GITHUB_REPOSITORY" --pattern beta.json --dir _site \
              || echo "Release $beta_tag has no beta.json; no beta feed published." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The newest stable release's feed is served here as well. GitHub's
          # releases/latest/download redirect chain took 15.6 s on one network
          # against well under a second for Pages (#321); apps list this first
          # and keep the GitHub address as the fallback older builds still use.
          stable_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // ""' 2>/dev/null || true)"
          if [ -n "$stable_tag" ]; then
            gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir _site \
              || echo "Release $stable_tag has no latest.json; no stable feed published." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Never publish a feed that is not valid JSON.
          for feed in _site/*.json; do
            [ -e "$feed" ] || continue
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$feed"
            echo "Publishing feed: $(basename "$feed")" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
