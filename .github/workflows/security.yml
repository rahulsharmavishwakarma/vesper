name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history on every supported workflow event
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --log-opts=--all
      - name: Scan the checked-out tree for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.74.0
          format: table
          scanners: secret
          exit-code: '1'

  dependencies:
    name: Dependencies
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Minisign secret keys and key/password filenames evade gitleaks and
      # detect-private-key; the enrolled public key stays allowed (Refs #65).
      - name: Refuse private signing keys in the tree
        run: node scripts/check-no-private-keys.mjs
      - name: Audit locked npm dependencies including build tools
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Install Rust
        run: rustup show active-toolchain
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: false
      - name: Audit all locked Python contributor groups
        run: |
          uv sync --locked
          make audit-python
      - name: Install pinned RustSec client
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Test the maintained GLib backport with optimizations enabled
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-dev pkg-config
          make test-glib-backport
      - name: Verify patched GLib and audit Cargo.lock against RustSec advisories
        run: make audit-rust

  python-benchmarks:
    name: Python benchmarks (${{ matrix.project }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [audio-frontend, vibevoice, onnx-quantize, mlx-convert]
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PYTHON_AUDIT_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: false
      - name: Audit the locked benchmark graph on its supported platform
        run: |
          uv sync --locked
          make "audit-python-$PYTHON_AUDIT_PROJECT"
