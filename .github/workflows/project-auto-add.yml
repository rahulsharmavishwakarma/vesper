name: Project auto-add

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  add:
    name: Add to Vesper project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check automation secret
        id: secret
        run: |
          if [ -z "${{ secrets.PROJECT_AUTOMATION_PAT }}" ]; then
            {
              echo "Project auto-add is not configured: the PROJECT_AUTOMATION_PAT secret is missing."
              echo "See docs/project-workflow.md (GitHub Project progress view) for the one-time setup."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        if: steps.secret.outputs.configured == 'true'
        with:
          project-url: https://github.com/users/rahulsharmavishwakarma/projects/2
          github-token: ${{ secrets.PROJECT_AUTOMATION_PAT }}
