name: Nightly

# Builds the default branch daily into a rolling `nightly` prerelease (Refs #205).
# Nightly is unsigned, installs beside stable under its own app identity, never
# touches the version files, creates no vX.Y.Z tag, and never moves the `latest`
# release or the stable/beta update feeds. Download-only for now; the in-app
# nightly feed is a later step.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if main has not changed since the last nightly'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    env:
      FORCE: ${{ inputs.force }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Skip unchanged or unverified commits
        id: decide
        run: |
          set -eu
          sha="$GITHUB_SHA"
          date="$(date -u +%Y%m%d)"
          version="$(node scripts/nightly.mjs version "$date")"
          {
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          # Releases are immutable, so every nightly has its own tag,
          # nightly-YYYYMMDD-<short sha>; the newest one names the last build.
          last_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[]|select(.tag_name|startswith("nightly-"))][0].tag_name // ""' 2>/dev/null || true)"
          last="${last_tag##*-}"
          if [ "$FORCE" != "true" ] && [ -n "$last" ] && [ "$last" = "${sha:0:7}" ]; then
            echo "main is unchanged since the last nightly ($sha); skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never publish a build of a commit whose own checks did not pass.
          checks="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --commit "$sha" --json conclusion --jq '[.[]|.conclusion]|if length==0 then "none" elif all(.=="success") then "success" else "other" end')"
          if [ "$checks" != "success" ]; then
            echo "Check workflow for $sha is '$checks', not success; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop package (macOS)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    # The nightly-only updater key lives in this environment, which only the
    # main branch may use (#262). Without it the build skips the update archive.
    environment: nightly
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # Tauri skips the Finder step that writes the DMG window layout (.DS_Store)
      # whenever CI is set, so published DMGs opened as a plain window (#252).
      # package-release.sh fails a DMG without that layout.
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Check macOS native prerequisites
        run: |
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
          xcrun --find clang
          xcrun --find clang++
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent metalToolchain
          fi
          xcrun metal --version
      - name: Build pinned native ASR runtime
        run: |
          node scripts/sherpa-runtime.mjs
          printf 'SHERPA_ONNX_LIB_DIR=%s\n' "$(node scripts/sherpa-runtime.mjs --lib-dir)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Apply the nightly identity and version (not committed)
        run: node scripts/nightly.mjs apply "$VERSION"
      - name: Build desktop bundles
        run: npm run desktop:build
      - name: Collect nightly artifact
        run: sh scripts/package-release.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/vesper-macos-arm64.dmg
            release/vesper-macos-arm64.app.tar.gz
            release/vesper-macos-arm64.app.tar.gz.sig
          # The DMG is always produced; the update archive only with the key.
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  publish:
    name: Publish the nightly prerelease
    needs: [plan, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Dispatching pages.yml with GITHUB_TOKEN is allowed.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          path: dmg
          merge-multiple: true
      - name: Publish the nightly prerelease
        run: |
          set -eu
          # Immutable releases cannot be edited and their tag names are never
          # reusable, so each nightly gets its own tag and the previous nightly
          # is removed only after the new one exists.
          tag="nightly-${VERSION##*.}-${SHA:0:7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir assets
          cp dmg/vesper-macos-arm64.dmg assets/vesper-nightly-macos-arm64.dmg
          # A signed update archive exists only when the nightly key was
          # available. Then publish it with a feed manifest that Pages serves
          # at the address nightly builds check; otherwise skip the feed.
          feed=0
          if [ -f dmg/vesper-macos-arm64.app.tar.gz ] && [ -f dmg/vesper-macos-arm64.app.tar.gz.sig ]; then
            cp dmg/vesper-macos-arm64.app.tar.gz assets/vesper-nightly-macos-arm64.app.tar.gz
            cp dmg/vesper-macos-arm64.app.tar.gz.sig assets/vesper-nightly-macos-arm64.app.tar.gz.sig
            node scripts/compose-updater-manifest.mjs --version="$VERSION"               --archive=assets/vesper-nightly-macos-arm64.app.tar.gz               --sig=assets/vesper-nightly-macos-arm64.app.tar.gz.sig               --url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/vesper-nightly-macos-arm64.app.tar.gz"               --notes="Nightly ${VERSION} built from main at ${SHA:0:7}."               --out=assets/nightly.json
            feed=1
          fi
          (cd assets && sha256sum -- * > SHA256SUMS)
          notes="Unsigned nightly build of main at ${SHA}, version ${VERSION}. Installs beside the stable app with its own settings and models. Not for production use. It is unsigned and not notarized: macOS asks you to allow it under System Settings, Privacy & Security, Open Anyway."
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --prerelease --latest=false \
            --title "Vesper Nightly ${VERSION}" --notes "$notes" \
            assets/*
          # Keep only the newest nightly. Deleting an immutable release is
          # allowed; its tag stays reserved, which is why tags are never reused.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName | select(startswith("nightly-"))' |
            while IFS= read -r old; do
              [ "$old" = "$tag" ] || gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
            done
          echo "Nightly ${VERSION}: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
          if [ "$feed" = 1 ]; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Requested a Pages deploy for the nightly feed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No signed update archive (nightly key unavailable); no feed published." >> "$GITHUB_STEP_SUMMARY"
          fi
