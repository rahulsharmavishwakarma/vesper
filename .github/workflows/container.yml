name: Container

# Optional development preview only; never a desktop release or PR gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test browser preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: version
        name: Read synchronized application version
        run: echo "value=$(node scripts/version.mjs show)" >> "$GITHUB_OUTPUT"
      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: vesper-browser-preview:ci
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test health endpoint
        run: |
          container_id=$(docker run --detach vesper-browser-preview:ci)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs "$container_id"; exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
          docker exec "$container_id" wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok
      - name: Block high-severity image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vesper-browser-preview:ci
          version: v0.74.0
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
