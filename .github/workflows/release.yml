name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag to promote to published (for example v0.2.0)'
        required: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Required checks
    if: github.event_name == 'push'
    # actionlint 1.7.12 does not yet parse the new $/ syntax.
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository]

  security:
    name: Required security
    if: github.event_name == 'push'
    # actionlint 1.7.12 does not yet parse the new $/ syntax.
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]

  desktop:
    name: Desktop package (macOS)
    if: github.event_name == 'push'
    needs: [checks, security]
    runs-on: macos-15
    timeout-minutes: 90
    # The updater signing key lives in the production environment; without
    # this the secrets resolve empty and the build silently skips the
    # signed updater archive and feed (Refs #206).
    environment: production
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # Enrolled updater key (Refs #65). Absent on forks: the build then
      # produces no signed updater archive and packaging skips the feed.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The strict bundle build packages the speaker runtime through uv.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: false
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Check macOS native prerequisites
        run: |
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
          xcrun --find clang
          xcrun --find clang++
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent metalToolchain
          fi
          xcrun metal --version
      - name: Build pinned native ASR runtime
        run: |
          node scripts/sherpa-runtime.mjs
          printf 'SHERPA_ONNX_LIB_DIR=%s\n' "$(node scripts/sherpa-runtime.mjs --lib-dir)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Verify tag and application versions
        run: node scripts/version.mjs check --tag="$GITHUB_REF_NAME"
      - name: Build desktop bundles
        run: npm run desktop:build
      - name: Collect release artifact
        run: sh scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  draft:
    name: Stage draft candidate
    if: github.event_name == 'push'
    needs: desktop
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      # Draft creation and asset upload inherently need write. Flipping a
      # draft to published additionally requires the production environment.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS
      - name: Upload assets to the draft release without publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT_ONLY: '1'
        run: node scripts/publish-release.mjs
      - name: Upload updater archive, signature and feed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          archive=release/vesper-macos-arm64.app.tar.gz
          sig="$archive.sig"
          if [ ! -f "$archive" ]; then
            echo "No updater archive in candidate; skipping feed (unsigned build)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -f "$sig" ]; then
            echo "Updater archive without signature; refusing." >&2
            exit 1
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Not a draft; refusing to touch published updater assets." >&2
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            *"-"*) manifest=beta.json ;;
            *) manifest=latest.json ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          notes="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/vesper-macos-arm64.app.tar.gz"
          node scripts/compose-updater-manifest.mjs --version="$version" --archive="$archive" --sig="$sig" --url="$url" --notes="$notes" --out="release/$manifest"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$archive" "$sig" "release/$manifest"
          echo "Updater feed: https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$manifest" >> "$GITHUB_STEP_SUMMARY"
      - name: Record candidate links
        run: |
          {
            echo "Draft candidate: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
            echo "Promotion requires the approval-gated promote job (workflow dispatch with tag=$GITHUB_REF_NAME)."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote draft to published
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Tag must be vX.Y.Z or vX.Y.Z-prerelease, got: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify tag and application versions agree
        run: node scripts/version.mjs check --tag="$TAG"
      - name: Publish the verified draft without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '{draft: .isDraft, prerelease: .isPrerelease}')"
          if [ "$(printf '%s' "$state" | grep -o '"draft":[^,]*' | cut -d: -f2)" != "true" ]; then
            echo "Refusing to promote: $TAG is not a draft. Roll back with a higher patch version instead." >&2
            exit 1
          fi
          case "$TAG" in
            *"-"*) prerelease=true ;;
            *)
              if [ "$(printf '%s' "$state" | grep -o '"prerelease":[^}]*' | cut -d: -f2)" = "true" ]; then
                prerelease=true
              else
                prerelease=false
              fi
              ;;
          esac
          if [ "$prerelease" = "true" ]; then latest=false; else latest=true; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease" --latest="$latest"
      - name: Record download links
        run: |
          {
            echo "Version download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/vesper-macos-arm64.dmg"
            echo "Latest stable: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/vesper-macos-arm64.dmg"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify published release
    if: github.event_name == 'release'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify tag and application versions agree
        run: node scripts/version.mjs check --tag="$TAG"
      - name: Verify published DMG checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verify-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'vesper-macos-arm64.dmg' --pattern 'SHA256SUMS' --dir verify-assets
          (cd verify-assets && sha256sum -c SHA256SUMS)
      - name: Record verification
        run: |
          {
            echo "Verified $TAG: tag/version agreement, both assets present, DMG checksum valid."
            echo "Version download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/vesper-macos-arm64.dmg"
          } >> "$GITHUB_STEP_SUMMARY"
