[package]
name = "vesper-inference"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
mlx = ["dep:vesper-mlx", "vesper-core/mlx", "vesper-models/mlx"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
rocm = ["llama-cpp-2/rocm"]

[dependencies]
vesper-core.workspace = true
vesper-audio.workspace = true
vesper-models.workspace = true
vesper-nemo.workspace = true
vesper-mlx = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sherpa-onnx = "=1.13.8"
llama-cpp-2 = { version = "=0.1.156", default-features = false, features = ["mtmd"] }
encoding_rs = "0.8"
unicode-segmentation = "1.13"
tempfile.workspace = true
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
