[package]
name = "transcribe-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
mlx = ["dep:transcribe-mlx", "transcribe-core/mlx", "transcribe-models/mlx"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
rocm = ["llama-cpp-2/rocm"]

[dependencies]
transcribe-core.workspace = true
transcribe-audio.workspace = true
transcribe-models.workspace = true
transcribe-nemo.workspace = true
transcribe-mlx = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sherpa-onnx = "=1.13.8"
llama-cpp-2 = { version = "=0.1.156", default-features = false, features = ["mtmd"] }
encoding_rs = "0.8"
unicode-segmentation = "1.13"
tempfile.workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
