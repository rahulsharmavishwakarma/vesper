minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
        # Existing public benchmark evidence has a separate bounded limit.
        exclude: &large-evidence ^(benchmarks/asr/results/2026-09-16-gemma4\.json|docs/validation/audio-frontend-integration-2026-09-18\.json|docs/validation/whisper-adapter-2026-09-18\.json)$
      - id: check-added-large-files
        alias: check-evidence-size
        name: Check size of existing benchmark evidence
        args: [--maxkb=5120, --enforce-all]
        files: *large-evidence
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        # Unified diff context must preserve upstream whitespace exactly.
        exclude: ^(patches|scripts/native-tests)/.*\.patch$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 4fb43823ef3d152d239e92d7d5cb04783b548062 # v8.28.0
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        additional_dependencies: [github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      - id: zizmor
        args: [--offline, --no-progress]

  - repo: local
    hooks:
      - id: transcribe-fast-check
        name: transcribe Python locks, format, language lint, types and Node tests
        entry: make check-fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: transcribe-full-check
        name: transcribe full language, native and browser suite
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
